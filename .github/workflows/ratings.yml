name: Ratings operation

# ratings-v1 unattended operation (docs/ratings-v1.md §9). scripts/ratings_ops.py reads
# the repository (ledger, universe parts) and the clock, does what is due and commits
# and pushes each public result when it is made; scripts/ratings.py and the registry
# still refuse whatever the protocol forbids.
# Push changes to this file without a skip marker in the commit message (whether a
# skipped push registers the schedule is unverified). GitHub has run this account's
# schedules 5-7 h late since 2026-08-31 (soccz/EcoGuard; the first run here came at
# 06:12 UTC on 2026-10-07), so the hours below are best effort: an on-time
# workflow_dispatch (mode=operate) from outside is the primary trigger (docs §9).
on:
  schedule:
    # Registration days (UTC 1st-10th), every two hours 00:23-14:23 UTC = 09:23-23:23
    # KST: Yahoo blanked the latest KRX closes around 00:30 KST (D17), so KR work stays
    # in the Korean day; SSGA's T holdings (posted the next US business day) stay up
    # until the following posting, which these slots cover.
    - cron: "23 0-14/2 1-10 * *"
    # The computability-check gate: asOf 2026-10-19, recorded from 2026-10-20.
    - cron: "23 0-14/2 19-23 10 *"
    # Weekly official evaluation: Saturday 02:53 UTC (Friday evening in New York).
    - cron: "53 2 * * 6"
    # Midweek run: keeps the Actions cache (kept series) from expiring after 7 days.
    - cron: "53 2 * * 3"
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearse: universes of the latest sessions, collected and checked, nothing recorded; operate: what is due, recorded and pushed"
        type: choice
        options: [rehearse, operate]
        default: rehearse
      evaluate:
        description: "operate only: run the official evaluation too"
        type: choice
        options: ["no", "yes"]
        default: "no"
      limit:
        description: "rehearse only: smoke universes of the first N members (blank: full)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ratings-operation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPERATE: ${{ inputs.mode != 'rehearse' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is now, not the commit the run was queued at: a run that
          # waited behind another must see the parts and events it pushed.
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore kept evaluation series and unfinished collections
        if: env.OPERATE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            data/ratings/sources
            data/ratings/series
            data/ratings/work
          key: ratings-ops-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ratings-ops-
      - name: Install the tests' numpy cross-check (hash-pinned; skipped if PyPI fails)
        continue-on-error: true
        run: |
          grep '^numpy==' requirements-offline.lock > "$RUNNER_TEMP/numpy.txt"
          python -m pip install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/numpy.txt"
      - name: Check the ratings code offline
        # ratings/ needs only the standard library.
        run: python -m unittest discover -s tests -p 'test_ratings_*.py'
      - name: Operate
        id: operate
        if: env.OPERATE == 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          EVALUATE: ${{ (github.event.schedule == '53 2 * * 6' || inputs.evaluate == 'yes') && 'yes' || 'no' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          flags="--push --prune"
          if [ "$EVALUATE" = yes ]; then flags="$flags --evaluate"; fi
          python scripts/ratings_ops.py operate $flags
      - name: Rehearse (nothing recorded or pushed)
        if: env.OPERATE != 'true'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/ratings_ops.py rehearse ${LIMIT:+--limit "$LIMIT"}
      - name: Save kept evaluation series and unfinished collections
        if: always() && env.OPERATE == 'true' && steps.operate.outputs.worked == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            data/ratings/sources
            data/ratings/series
            data/ratings/work
          key: ratings-ops-${{ github.run_id }}-${{ github.run_attempt }}
